<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <header class="header">
        <h2>Dynamic: Blog</h2>
        <p>Read interesting posts from our blog</p>
    </header>
    
    <main class="container">
        <section class="controls">
            <input
            type ="search"
            id = "searchInput"
            placeholder = "Search post by title....">
            <button id ="reload button" type ="button">
                Reload posts
            </button>
        </section>
        <p id="statusMessage" role="status" aria-live="polite">
            Loading posts.....
        </p>
        <section id ="postsContainer"
        class="posts-grid"></section>
        
    </main>
    <script src ="blok.js"></script>

</body>
</html>
